<button [matMenuTriggerFor]="chatFilterMenu" mat-icon-button class="menu-btn">
  <mat-icon>more_vert</mat-icon>
</button>

<mat-menu #chatFilterMenu="matMenu" class="minimal-menu">
  <div class="menu-title" style="padding: 8px 16px; font-weight: bold">{{languageService.translate('FILTER_BY')}}</div>

  @for (option of options; track option.id) {
    <button mat-menu-item (click)="select(option.id)">
      <mat-icon [style.visibility]="filterSelected === option.id ? 'visible' : 'hidden'">
        check
      </mat-icon>
      <span>{{ updateLabels(option.label)}}</span>
    </button>
  }
</mat-menu>
